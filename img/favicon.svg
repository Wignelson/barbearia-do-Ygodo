<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="stripes" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#f2ede1" />
      <rect width="3" height="9" fill="#7a2230" />
      <rect x="4.5" width="3" height="9" fill="#c9a227" />
    </pattern>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0c25f" />
      <stop offset="1" stop-color="#9c7f1f" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="#0d0d0d" stroke="#c9a227" stroke-width="2" />

  <rect x="24" y="10" width="16" height="10" rx="3" fill="url(#capGrad)" />
  <rect x="24" y="44" width="16" height="10" rx="3" fill="url(#capGrad)" />

  <clipPath id="poleClip">
    <rect x="23" y="16" width="18" height="32" rx="7" />
  </clipPath>
  <rect x="23" y="16" width="18" height="32" rx="7" fill="url(#stripes)" clip-path="url(#poleClip)" />
  <rect x="23" y="16" width="18" height="32" rx="7" fill="none" stroke="#0d0d0d" stroke-width="1.5" />
</svg>
