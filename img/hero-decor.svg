xml
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <pattern id="poleStripes2" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="20" height="20" fill="#f2ede1" />
      <rect width="7" height="20" fill="#7a2230" />
      <rect x="10" width="7" height="20" fill="#c9a227" />
    </pattern>

    <linearGradient id="capGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c96a" />
      <stop offset="1" stop-color="#8a6f1c" />
    </linearGradient>

    <linearGradient id="toolGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd98a" />
      <stop offset="0.5" stop-color="#c9a227" />
      <stop offset="1" stop-color="#7c631a" />
    </linearGradient>

    <radialGradient id="sphereGrad" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#f7ecc4" />
      <stop offset="0.45" stop-color="#dcb84a" />
      <stop offset="1" stop-color="#7c631a" />
    </radialGradient>

    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- moldura circular do emblema -->
  <circle cx="200" cy="200" r="188" fill="#14110f" stroke="#c9a227" stroke-width="4" />
  <circle cx="200" cy="200" r="168" fill="none" stroke="#7a2230" stroke-width="2" opacity="0.65" />

  <!-- duas navalhas cruzadas, bem no fundo -->
  <g filter="url(#dropShadow)" opacity="0.9">
    <g transform="translate(200 240) rotate(-30)">
      <path d="M -70 0 C -50 -14, -10 -14, 4 0 L 4 8 C -10 20, -50 20, -70 8 Z" fill="url(#toolGrad)" stroke="#14110f" stroke-width="1.5" />
      <rect x="2" y="-4" width="34" height="12" rx="5" fill="#3a3128" />
    </g>
    <g transform="translate(200 240) rotate(30) scale(-1 1)">
      <path d="M -70 0 C -50 -14, -10 -14, 4 0 L 4 8 C -10 20, -50 20, -70 8 Z" fill="url(#toolGrad)" stroke="#14110f" stroke-width="1.5" />
      <rect x="2" y="-4" width="34" height="12" rx="5" fill="#3a3128" />
    </g>
  </g>

  <!-- duas máquinas de corte cruzadas -->
  <g filter="url(#dropShadow)">
    <g transform="translate(200 150) rotate(-52)">
      <rect x="-15" y="-95" width="30" height="98" rx="7" fill="url(#toolGrad)" />
      <rect x="-19" y="3" width="38" height="22" rx="4" fill="url(#toolGrad)" />
      <path d="M -19 25 L -13 34 L -7 25 L -1 34 L 5 25 L 11 34 L 19 25 Z" fill="#14110f" />
      <rect x="-9" y="-80" width="18" height="4" rx="2" fill="#3a3128" opacity="0.7" />
      <rect x="-9" y="-68" width="18" height="4" rx="2" fill="#3a3128" opacity="0.7" />
    </g>
    <g transform="translate(200 150) rotate(52) scale(-1 1)">
      <rect x="-15" y="-95" width="30" height="98" rx="7" fill="url(#toolGrad)" />
      <rect x="-19" y="3" width="38" height="22" rx="4" fill="url(#toolGrad)" />
      <path d="M -19 25 L -13 34 L -7 25 L -1 34 L 5 25 L 11 34 L 19 25 Z" fill="#14110f" />
      <rect x="-9" y="-80" width="18" height="4" rx="2" fill="#3a3128" opacity="0.7" />
      <rect x="-9" y="-68" width="18" height="4" rx="2" fill="#3a3128" opacity="0.7" />
    </g>
  </g>

  <!-- pincéis de barba, ao lado das tesouras -->
  <g filter="url(#dropShadow)">
    <g transform="translate(96 268) rotate(-18)">
      <ellipse cx="0" cy="0" rx="16" ry="22" fill="#221c18" />
      <rect x="-6" y="16" width="12" height="34" rx="5" fill="url(#capGrad2)" />
    </g>
    <g transform="translate(304 268) rotate(18)">
      <ellipse cx="0" cy="0" rx="16" ry="22" fill="#221c18" />
      <rect x="-6" y="16" width="12" height="34" rx="5" fill="url(#capGrad2)" />
    </g>
  </g>

  <!-- duas tesouras cruzadas -->
  <g filter="url(#dropShadow)">
    <g transform="translate(140 300) rotate(-18)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="url(#toolGrad)" stroke-width="6" />
      <circle cx="0" cy="30" r="15" fill="none" stroke="url(#toolGrad)" stroke-width="6" />
      <path d="M 10 -6 L 68 -50" stroke="url(#toolGrad)" stroke-width="6" stroke-linecap="round" />
      <path d="M 10 36 L 68 -8" stroke="url(#toolGrad)" stroke-width="6" stroke-linecap="round" />
      <circle cx="10" cy="15" r="4" fill="url(#toolGrad)" />
    </g>
    <g transform="translate(260 300) rotate(18) scale(-1 1)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="url(#toolGrad)" stroke-width="6" />
      <circle cx="0" cy="30" r="15" fill="none" stroke="url(#toolGrad)" stroke-width="6" />
      <path d="M 10 -6 L 68 -50" stroke="url(#toolGrad)" stroke-width="6" stroke-linecap="round" />
      <path d="M 10 36 L 68 -8" stroke="url(#toolGrad)" stroke-width="6" stroke-linecap="round" />
      <circle cx="10" cy="15" r="4" fill="url(#toolGrad)" />
    </g>
  </g>

  <!-- poste de barbearia central, com globo no topo -->
  <g filter="url(#dropShadow)">
    <rect x="169" y="96" width="62" height="228" rx="31" fill="url(#poleStripes2)" />
    <rect x="169" y="96" width="62" height="228" rx="31" fill="none" stroke="#14110f" stroke-width="3" />
    <ellipse cx="200" cy="96" rx="31" ry="13" fill="url(#capGrad2)" />
    <ellipse cx="200" cy="324" rx="31" ry="13" fill="url(#capGrad2)" />
    <ellipse cx="200" cy="328" rx="36" ry="10" fill="#3a3128" opacity="0.5" />

    <rect x="182" y="78" width="36" height="18" rx="4" fill="url(#capGrad2)" />
    <circle cx="200" cy="56" r="26" fill="url(#sphereGrad)" stroke="#14110f" stroke-width="2" />
    <ellipse cx="191" cy="47" rx="8" ry="5" fill="#fff8e4" opacity="0.7" />
  </g>
</svg>